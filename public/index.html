<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OECMS CBT Portal</title>
<style>
:root {
  --teal: #16264f;        /* primary accent -> deep navy (was teal) */
  --teal-dark: #0a1730;   /* darker navy for hover/active */
  --navy: #12234c;        /* heading text on light cards */
  --red: #c1272d;
  --gold: #d4af37;        /* accent gold */
  --gold-dark: #b8952e;
  --cream: #0a1730;       /* page background -> dark navy (was cream) */
  --ink: #1c2430;
  --line: #e1ddd0;
  --ok: #1a7a3c;
  --err: #b3261e;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
}
#app { max-width: 1000px; margin: 0 auto; padding: 0 0 60px; }

.topbar {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
  padding: 30px 16px 34px; margin-bottom: 22px;
  background: linear-gradient(180deg, #12234c 0%, #0a1730 100%);
  border-bottom: 4px solid var(--gold);
}
.topbar-logo { width: 78px; height: 78px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
.topbar-text { display: flex; flex-direction: column; align-items: center; }
.topbar-title { font-size: 1.5rem; font-weight: 800; color: #fff; letter-spacing: .3px; text-transform: uppercase; }
.topbar-sub { font-size: .92rem; color: var(--gold); font-weight: 700; margin-top: 4px; }
.topbar-meta { font-size: .8rem; color: #b9c2d6; margin-top: 2px; }
.topbar .btn.ghost { position: absolute; left: 16px; top: 16px; color: #fff; border-color: rgba(255,255,255,.5); }
.topbar { position: relative; }

#app > .topbar + .flash, #app > .flash { margin: 0 16px 14px; }
#app > *:not(.topbar) { padding-left: 16px; padding-right: 16px; }
#app > .topbar { padding-left: 16px; padding-right: 16px; }

.hero { text-align: center; padding: 18px 0 6px; }
.hero-logo { width: 110px; height: 110px; border-radius: 50%; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
.hero h1 { color: #fff; margin: 14px 0 4px; font-size: 1.6rem; }
.hero-sub { color: var(--gold); margin-bottom: 8px; font-weight: 600; }

.portal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-top: 18px; }
.portal-card {
  background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px;
  cursor: pointer; transition: transform .12s, box-shadow .12s; text-align: left;
}
.portal-card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(0,0,0,.35); border-color: var(--gold); }
.portal-icon {
  width: 40px; height: 40px; border-radius: 10px; background: var(--navy); color: var(--gold);
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; margin-bottom: 10px;
}
.portal-card h3 { margin: 0 0 4px; color: var(--navy); }
.portal-card p { margin: 0; color: #667; font-size: .88rem; }

.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-top: 10px; }
.card.narrow { max-width: 420px; margin: 20px auto; }
.card h2 { color: var(--navy); margin-top: 0; }

.stepbox { background: #fff; border-radius: 14px; padding: 22px; margin-top: 16px; }
.stepbox h2 { color: var(--navy); margin: 0 0 4px; font-size: 1.05rem; letter-spacing: .3px; text-transform: uppercase; border-bottom: 3px solid var(--gold); padding-bottom: 10px; }
.stepbox-body { margin-top: 14px; }

label { display: block; font-size: .82rem; font-weight: 700; color: var(--navy); margin: 12px 0 4px; }
input, select, textarea {
  width: 100%; padding: 9px 11px; border: 1px solid #c9c4b4; border-radius: 8px;
  font-size: .95rem; font-family: inherit; background: #fff; color: var(--ink);
}
textarea { resize: vertical; }

.btn {
  display: inline-block; padding: 9px 16px; border-radius: 8px; border: none;
  background: var(--navy); color: #fff; font-weight: 700; cursor: pointer; font-size: .9rem;
  margin-top: 12px; margin-right: 8px;
}
.btn.primary { background: var(--navy); color: var(--gold); }
.btn.primary:hover { background: var(--teal-dark); }
.btn.danger { background: var(--red); }
.btn.ghost { background: transparent; color: var(--navy); border: 1px solid var(--navy); }
.btn.small { padding: 5px 10px; font-size: .78rem; margin-top: 0; }
.btn.big { font-size: 1.05rem; padding: 13px 26px; letter-spacing: .4px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.spread { justify-content: space-between; align-items: center; }
.row > input, .row > select, .row > textarea { width: auto; flex: 1; }

.dash { margin-top: 8px; }
.tabbar { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 2px solid var(--line); margin-bottom: 16px; background: #fff; border-radius: 14px 14px 0 0; padding: 6px 6px 0; }
.tabbtn {
  background: none; border: none; padding: 9px 14px; font-weight: 700; color: #667;
  cursor: pointer; border-bottom: 3px solid transparent; font-size: .88rem;
}
.tabbtn.active { color: var(--navy); border-bottom-color: var(--gold); }
.tabpanel { background: #fff; border: 1px solid var(--line); border-radius: 0 0 14px 14px; padding: 20px; }

.tbl { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: .88rem; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; }
.tbl th { background: var(--navy); color: #fff; }
.tbl.small td, .tbl.small th { padding: 5px 7px; font-size: .82rem; }
.tbl input, .tbl select { padding: 5px 7px; font-size: .85rem; }

.chiplist { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { background: #fff8e6; border: 1px solid var(--gold); color: var(--gold-dark); padding: 5px 10px; border-radius: 20px; font-size: .84rem; }
.chip a { color: var(--red); text-decoration: none; margin-left: 6px; font-weight: 800; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-top: 10px; }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }

.hint { color: #78807a; font-size: .82rem; margin-top: 8px; }
.ok { color: var(--ok); font-weight: 700; }
.err { color: var(--err); font-weight: 700; }

.flash { padding: 10px 16px; border-radius: 8px; margin-bottom: 12px; font-weight: 600; font-size: .9rem; }
.flash.success { background: #e4f5e8; color: var(--ok); border: 1px solid #b6e2c0; }
.flash.error { background: #fbe7e6; color: var(--err); border: 1px solid #f0bdb9; }
.flash.info { background: #eaf2fb; color: #1b4b8a; border: 1px solid #c6dcf5; }

.footer { text-align: center; color: #8695b3; font-size: .76rem; margin-top: 40px; padding: 14px 16px 0; border-top: 1px solid #22345c; }

.noticebox {
  background: #fff7e6; border: 1px solid var(--gold); color: #6b4e00; padding: 12px 14px;
  border-radius: 10px; font-size: .87rem; margin: 14px 0;
}
.taskcard { background: #fbfaf6; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.taskcard h3 { margin: 0 0 6px; color: var(--navy); }

.runbar { position: sticky; top: 0; background: #fff; padding: 10px 0; z-index: 5; }
.timer { font-size: 1.4rem; font-weight: 800; color: var(--red); background: #fbe7e6; padding: 6px 16px; border-radius: 8px; }
.qview { border-bottom: 1px solid var(--line); padding: 14px 0; }
.qview-text { font-weight: 600; margin-bottom: 8px; }
.qview-opts { display: grid; gap: 6px; }
.opt { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: .9rem; }
.opt.sel { border-color: var(--gold); background: #fff8e6; }
.opt input { width: auto; }

.qedit { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fbfaf6; }
.qnum { font-weight: 800; color: var(--navy); margin-bottom: 6px; }
.qopts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
@media (max-width: 640px) { .qopts { grid-template-columns: 1fr; } }
.qedit select { width: 90px; }

/* ---------- step-pattern selector cards (class/subject pick) ---------- */
.pickgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 6px; }
.pickcard {
  background: #f4f6fb; border: 1px solid var(--line); border-radius: 10px; padding: 18px 14px;
  text-align: center; cursor: pointer; transition: all .12s;
}
.pickcard:hover { border-color: var(--gold); background: #fff8e6; }
.pickcard.sel { border-color: var(--gold); background: #fff8e6; box-shadow: 0 0 0 2px var(--gold) inset; }
.pickcard-title { font-weight: 800; color: var(--navy); font-size: 1.05rem; }
.pickcard-sub { color: #667; font-size: .82rem; margin-top: 4px; }

/* ---------- printable result sheet ---------- */
.result-sheet {
  position: relative; background: #fff; border: 2px solid var(--navy); border-radius: 10px;
  padding: 26px; margin-top: 14px; overflow: hidden;
}
.watermark {
  position: absolute; top: 50%; left: 50%; width: 60%; opacity: .07;
  transform: translate(-50%, -50%); pointer-events: none;
}
.result-header { display: flex; align-items: center; gap: 16px; border-bottom: 2px solid var(--gold); padding-bottom: 12px; position: relative; }
.result-logo { width: 70px; height: 70px; border-radius: 50%; }
.result-school { font-size: 1.25rem; font-weight: 800; color: var(--navy); }
.result-addr { font-size: .82rem; color: #556; }
.result-title { text-align: center; color: var(--navy); margin: 14px 0; position: relative; }
.result-meta { position: relative; font-size: .9rem; margin-bottom: 6px; }
.result-tbl { position: relative; }
.result-summary { position: relative; font-size: 1rem; margin-top: 10px; }
.result-footer { text-align: center; font-size: .76rem; color: #99a; margin-top: 16px; position: relative; }

@media print {
  .topbar, .footer, .noprint, .flash { display: none !important; }
  body { background: #fff; }
  .result-sheet { border: 2px solid #000; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== OECMS CBT PORTAL ===================== */

const LOGO = "/logo.jpg";

/* ---------- storage helpers ----------
   Talks to this app's own backend (Express + MongoDB), so every device
   that opens this site shares the exact same data. */
async function getData(key, fallback) {
  try {
    const r = await fetch('/api/kv/' + encodeURIComponent(key));
    const data = await r.json();
    return (data && data.value !== null && data.value !== undefined) ? data.value : fallback;
  } catch (e) {
    console.error('load error', key, e);
    return fallback;
  }
}
async function setData(key, value) {
  try {
    const r = await fetch('/api/kv/' + encodeURIComponent(key), {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ value })
    });
    const data = await r.json();
    return !!data.ok;
  } catch (e) {
    console.error('save error', key, e);
    return false;
  }
}

function uid(prefix) {
  return (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 9);
}

/* ---------- defaults ---------- */
const DEFAULT_CONFIG = {
  schoolName: "Onyema Excellent Child Model School",
  shortName: "E.C.M.S",
  address: "Iho, Imo State, Nigeria",
  phone: "",
  email: "excellentchildmodelschool1@gmail.com",
  managementPassword: "oecms-mgt-2026",
  firstTestMax: 15,
  cbtTestMax: 15,
  cbtExamMax: 40,
  theoryMax: 30,
  testDurationMin: 10,
  examDurationMin: 20,
  testQCount: 15,
  examQCount: 40,
  passwordUses: 5,
  session: "2026/2027",
  term: "First Term"
};

const SECTIONS = ['Primary', 'Junior Secondary', 'Senior Secondary'];
const DEFAULT_CLASSES = [
  { name: 'Primary 1', section: 'Primary' }, { name: 'Primary 2', section: 'Primary' },
  { name: 'Primary 3', section: 'Primary' }, { name: 'Primary 4', section: 'Primary' },
  { name: 'Primary 5', section: 'Primary' }, { name: 'Primary 6', section: 'Primary' },
  { name: 'JSS1', section: 'Junior Secondary' }, { name: 'JSS2', section: 'Junior Secondary' }, { name: 'JSS3', section: 'Junior Secondary' },
  { name: 'SS1', section: 'Senior Secondary' }, { name: 'SS2', section: 'Senior Secondary' }, { name: 'SS3', section: 'Senior Secondary' }
];
function classSection(className) {
  const c = DB.classes.find(x => x.name === className);
  return c ? c.section : '';
}
function classesBySection(names) {
  const out = {};
  SECTIONS.forEach(s => out[s] = []);
  (names || DB.classes.map(c => c.name)).forEach(n => {
    const sec = classSection(n) || 'Junior Secondary';
    if (!out[sec]) out[sec] = [];
    out[sec].push(n);
  });
  return out;
}

/* ---------- global in-memory mirror of persisted data ---------- */
let DB = {
  config: null,
  subjects: [],
  classes: [],
  students: [],
  paid: {},
  questions: {},
  questionBank: {},
  teacherPassword: "",
  attempts: {},
  manualScores: {},
  resultAuth: {},
  entranceConfig: null,
  entranceCandidates: [],
  entranceAttempts: {}
};

let state = {
  view: 'home',
  mgmtAuthed: false,
  teacherAuthed: false,
  teacherSubjectId: null,
  studentReg: null,
  studentSubjectId: null,
  studentClass: null,
  runMode: null,       // 'test' | 'exam'
  runQuestions: [],
  runAnswers: {},
  runStartAt: null,
  runSecondsLeft: 0,
  runTimer: null,
  warnCount: 0,
  resultsReg: null,
  msg: null,
  msgType: 'info',
  aiBusy: false,
  bankEdit: null,
  questionDraft: null,
  runContext: 'student',   // 'student' | 'entrance'
  entranceCandidateId: null,
  mgmtEntranceCandName: '',
  mgmtEntranceCandClass: '',
  viewHistory: [],
  expandedSubjectId: null
};

/* ---------- boot ---------- */
async function boot() {
  const appEl = document.getElementById('app');
  if (appEl) appEl.innerHTML = `<div style="padding:60px 20px;text-align:center;color:#b9c2d6;font-size:1.1rem;">Loading OECMS CBT Portal…</div>`;

  const [
    config, subjects, classes, students, paid, questions, questionBank,
    teacherPassword, attempts, manualScores, resultAuth,
    entranceConfig, entranceCandidates, entranceAttempts
  ] = await Promise.all([
    getData('config', DEFAULT_CONFIG),
    getData('subjects', []),
    getData('classes', DEFAULT_CLASSES.slice()),
    getData('students', []),
    getData('paid', {}),
    getData('questions', {}),
    getData('questionBank', {}),
    getData('teacherPassword', 'oecms-teacher-2026'),
    getData('attempts', {}),
    getData('manualScores', {}),
    getData('resultAuth', {}),
    getData('entranceConfig', { subjects: [], qCountPerSubject: 15, durationMin: 20, password: 'oecms-entrance-2026' }),
    getData('entranceCandidates', []),
    getData('entranceAttempts', {})
  ]);
  DB.config = config;
  DB.subjects = subjects;
  DB.classes = classes;
  DB.students = students;
  DB.paid = paid;
  DB.questions = questions;
  DB.questionBank = questionBank;
  DB.teacherPassword = teacherPassword;
  DB.attempts = attempts;
  DB.manualScores = manualScores;
  DB.resultAuth = resultAuth;
  DB.entranceConfig = entranceConfig;
  DB.entranceCandidates = entranceCandidates;
  DB.entranceAttempts = entranceAttempts;
  migrateOldData();
  render();
}

/* Older saved data (from before class-sections existed) used plain class-name
   strings and subject-wide scheme/questions. Normalise it here so existing
   sites don't break — nothing is deleted, just reshaped to fit. */
function migrateOldData() {
  let classesChanged = false;
  DB.classes = DB.classes.map(c => {
    if (typeof c === 'string') {
      classesChanged = true;
      let section = 'Junior Secondary';
      if (/primary/i.test(c)) section = 'Primary';
      else if (/^ss/i.test(c.trim())) section = 'Senior Secondary';
      else if (/^jss/i.test(c.trim())) section = 'Junior Secondary';
      return { name: c, section };
    }
    return c;
  });
  if (classesChanged) setData('classes', DB.classes);

  let subjectsChanged = false;
  DB.subjects.forEach(s => {
    if (!Array.isArray(s.classes)) { s.classes = []; subjectsChanged = true; }
    if (!s.schemes || typeof s.schemes !== 'object') { s.schemes = {}; subjectsChanged = true; }
  });
  if (subjectsChanged) setData('subjects', DB.subjects);
}

function flash(msg, type) {
  state.msg = msg;
  state.msgType = type || 'info';
  render();
  setTimeout(() => { state.msg = null; render(); }, 4500);
}

function go(view) {
  if (state.view && state.view !== view) {
    state.viewHistory.push(state.view);
    if (state.viewHistory.length > 30) state.viewHistory.shift();
  }
  state.view = view;
  window.scrollTo(0, 0);
  render();
}
function goBack() {
  // Some screens have their own internal drill-down (subject -> class -> tabs,
  // or a class-picker inside a management tab) that never changes state.view,
  // so the generic history stack below doesn't know about those steps. Peel
  // those back one level at a time first.
  if (state.view === 'teacher' && state.teacherAuthed) {
    if (state.teacherClassId) { state.teacherClassId = null; state.questionDraft = null; window.scrollTo(0, 0); render(); return; }
    if (state.teacherSubjectId) { state.teacherSubjectId = null; window.scrollTo(0, 0); render(); return; }
  }
  if (state.view === 'student-login' && state.stuSelectedClass) {
    state.stuSelectedClass = null; state.stuSelectedSubject = null; window.scrollTo(0, 0); render(); return;
  }
  if (state.view === 'mgmt') {
    if (state.mgmtTab === 'payments' && state.payClass) { state.payClass = null; window.scrollTo(0, 0); render(); return; }
    if (state.mgmtTab === 'results' && state.mgmtResultsClass) { state.mgmtResultsClass = null; window.scrollTo(0, 0); render(); return; }
    if (state.expandedSubjectId) { state.expandedSubjectId = null; window.scrollTo(0, 0); render(); return; }
  }
  if (state.view === 'student-dash') state.studentReg = null;
  if (state.view === 'entrance-dash') state.entranceCandidateId = null;
  const prev = state.viewHistory.pop();
  state.fromAdmin = false;
  state.view = prev || 'home';
  window.scrollTo(0, 0);
  render();
}

/* ---------- grading / computation ---------- */
function grade(pct) {
  if (pct >= 70) return 'A';
  if (pct >= 60) return 'B';
  if (pct >= 50) return 'C';
  if (pct >= 45) return 'D';
  if (pct >= 40) return 'E';
  return 'F';
}

function subjectMaxTotal() {
  const c = DB.config;
  return c.firstTestMax + c.cbtTestMax + c.cbtExamMax + c.theoryMax;
}

function getAttempt(reg, subjectId) {
  return (DB.attempts[reg] && DB.attempts[reg][subjectId]) || {};
}
function getManual(reg, subjectId) {
  return (DB.manualScores[reg] && DB.manualScores[reg][subjectId]) || {};
}

// Returns null if not fully scored yet (missing components), else full breakdown
function secondTestMode(subjectId) {
  const s = DB.subjects.find(x => x.id === subjectId);
  return (s && s.secondTestMode === 'manual') ? 'manual' : 'cbt';
}
function subjectBreakdown(reg, subjectId) {
  const a = getAttempt(reg, subjectId);
  const m = getManual(reg, subjectId);
  const c = DB.config;
  const mode2 = secondTestMode(subjectId);
  const hasTest = mode2 === 'manual' ? (typeof m.test2 === 'number') : (typeof a.testScore === 'number');
  const cbtTestVal = mode2 === 'manual' ? m.test2 : a.testScore;
  const hasExam = typeof a.examScore === 'number';
  const hasT1 = typeof m.test1 === 'number';
  const hasTheory = typeof m.theory === 'number';
  const complete = hasTest && hasExam && hasT1 && hasTheory;
  const total = (hasT1 ? m.test1 : 0) + (hasTest ? cbtTestVal : 0) +
                (hasExam ? a.examScore : 0) + (hasTheory ? m.theory : 0);
  const max = subjectMaxTotal();
  const pct = max ? (total / max) * 100 : 0;
  return {
    test1: hasT1 ? m.test1 : null, test1Max: c.firstTestMax,
    cbtTest: hasTest ? cbtTestVal : null, cbtTestMax: c.cbtTestMax, cbtTestMode: mode2,
    cbtExam: hasExam ? a.examScore : null, cbtExamMax: c.cbtExamMax,
    theory: hasTheory ? m.theory : null, theoryMax: c.theoryMax,
    total, max, pct: Math.round(pct * 10) / 10,
    grade: complete ? grade(pct) : '-',
    complete
  };
}

function studentSubjects(reg) {
  // subjects a student has any record for (attempt or manual score)
  const ids = new Set();
  if (DB.attempts[reg]) Object.keys(DB.attempts[reg]).forEach(id => ids.add(id));
  if (DB.manualScores[reg]) Object.keys(DB.manualScores[reg]).forEach(id => ids.add(id));
  return Array.from(ids);
}

function classmates(className) {
  return DB.students.filter(s => s.class === className);
}

// rank of `reg` among classmates for one subject (only counts complete records)
function subjectRank(reg, subjectId, className) {
  const rows = classmates(className)
    .map(s => ({ reg: s.reg, b: subjectBreakdown(s.reg, subjectId) }))
    .filter(r => r.b.complete)
    .sort((a, b) => b.b.total - a.b.total);
  const idx = rows.findIndex(r => r.reg === reg);
  if (idx === -1) return { position: null, outOf: rows.length };
  return { position: idx + 1, outOf: rows.length };
}

function overallRank(reg, className) {
  const rows = classmates(className).map(s => {
    const subs = studentSubjects(s.reg);
    let total = 0, maxTot = 0, allComplete = subs.length > 0;
    subs.forEach(id => {
      const b = subjectBreakdown(s.reg, id);
      if (!b.complete) allComplete = false;
      total += b.total; maxTot += b.max;
    });
    return { reg: s.reg, total, maxTot, complete: allComplete };
  }).filter(r => r.complete).sort((a, b) => b.total - a.total);
  const idx = rows.findIndex(r => r.reg === reg);
  if (idx === -1) return { position: null, outOf: rows.length };
  return { position: idx + 1, outOf: rows.length };
}

/* ---------- render root ---------- */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = header() + banner() + body() + footerBar();
  window.__afterRender && window.__afterRender();
}

function header() {
  return `
  <div class="topbar">
    ${state.view !== 'home' ? `<button class="btn ghost small" style="position:absolute;left:16px;top:16px;margin:0;" onclick="goBack()">&larr; Back</button>` : ''}
    ${state.view !== 'home' ? `<button class="btn ghost small" style="position:absolute;right:16px;top:16px;margin:0;" onclick="confirmGoHome()">Home</button>` : ''}
    <img src="${LOGO}" class="topbar-logo" alt="OECMS logo"/>
    <div class="topbar-text">
      <div class="topbar-title">${esc(DB.config.schoolName)}</div>
      <div class="topbar-sub">Computer-Based Test (CBT) Examination Portal</div>
      <div class="topbar-meta">${esc(DB.config.term)} &nbsp;&bull;&nbsp; ${esc(DB.config.session)} Academic Session</div>
    </div>
  </div>`;
}

function confirmGoHome() {
  if (state.view === 'student-run') {
    if (!confirm('Leave now? Your test/exam is still in progress and this will NOT submit it for you.')) return;
  }
  goHome();
}
function goHome() {
  state.mgmtAuthed = false;
  state.teacherAuthed = false;
  state.teacherSubjectId = null;
  state.teacherClassId = null;
  state.teachTab = null;
  state.studentReg = null;
  state.stuSelectedClass = null;
  state.stuSelectedSubject = null;
  state.entranceCandidateId = null;
  state.fromAdmin = false;
  state.questionDraft = null;
  state.viewHistory = [];
  state.view = 'home';
  render();
}

function banner() {
  let out = '';
  if (typeof HAS_CLOUD_STORAGE !== 'undefined' && !HAS_CLOUD_STORAGE && state.view === 'home') {
    out += `<div class="flash info">Running in local mode: all data (students, subjects, scores) is saved in this browser only. Use the same browser/device for management, teaching, and student sessions, or host this file on a shared server for multi-device use.</div>`;
  }
  if (state.msg) out += `<div class="flash ${state.msgType}">${esc(state.msg)}</div>`;
  return out;
}

function footerBar() {
  return `<div class="footer">${esc(DB.config.schoolName)} &bull; ${esc(DB.config.address)} &bull; ${esc(DB.config.email)}${DB.config.phone ? ' &bull; ' + esc(DB.config.phone) : ''}</div>`;
}

function body() {
  switch (state.view) {
    case 'home': return viewHome();
    case 'mgmt-login': return viewMgmtLogin();
    case 'mgmt': return viewMgmt();
    case 'teacher-login': return viewTeacherLogin();
    case 'teacher': return viewTeacher();
    case 'teacher-subjectwide': return viewTeacherSubjectWide();
    case 'student-login': return viewStudentLogin();
    case 'student-dash': return viewStudentDash();
    case 'student-run': return viewStudentRun();
    case 'results-home': return viewResultsHome();
    case 'results-view': return viewResultsView();
    case 'entrance-portal': return viewEntrancePortal();
    case 'entrance-login': return viewEntranceLogin();
    case 'entrance-dash': return viewEntranceDash();
    case 'entrance-result-login': return viewEntranceResultLogin();
    case 'entrance-result-view': return viewEntranceResultView();
    default: return viewHome();
  }
}

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ===================== HOME ===================== */
function viewHome() {
  return `
  <div class="hero">
    <img src="${LOGO}" class="hero-logo" alt="logo"/>
    <h1>${esc(DB.config.shortName)} CBT Portal</h1>
    <p class="hero-sub">Select a portal to continue</p>
  </div>
  <div class="portal-grid">
    <div class="portal-card" onclick="go('student-login')">
      <div class="portal-icon">S</div>
      <h3>Student Portal</h3>
      <p>Take your CBT Test &amp; Examination.</p>
    </div>
    <div class="portal-card" onclick="go('teacher-login')">
      <div class="portal-icon">T</div>
      <h3>Teacher Portal</h3>
      <p>Upload scheme of work, set questions &amp; enter test/theory scores.</p>
    </div>
    <div class="portal-card" onclick="go('mgmt-login')">
      <div class="portal-icon">M</div>
      <h3>Management Portal</h3>

    </div>
    <div class="portal-card" onclick="go('results-home')">

/* ===================== MANAGEMENT ===================== */
function viewMgmtLogin() {
  return `
  <div class="card narrow">
    <h2>Management Login</h2>
    <label>Password</label>
    <input id="mgmtPass" type="password" placeholder="Enter management password"/>
    <button class="btn primary" onclick="doMgmtLogin()">Login</button>
  </div>`;
}
function doMgmtLogin() {
  const v = document.getElementById('mgmtPass').value;
  if (v === DB.config.managementPassword) {
    state.mgmtAuthed = true;
    state.mgmtTab = 'subjects';
    state.expandedSubjectId = null;
    state.payClass = null;
    state.mgmtResultsClass = null;
    state.apprSubject = null;
    go('mgmt');
  } else {
    flash('Incorrect password.', 'error');
  }
}

function viewMgmt() {
  if (!state.mgmtAuthed) return viewMgmtLogin();
  const tab = state.mgmtTab || 'subjects';
  const tabs = [
    ['subjects', 'Subjects'], ['classes', 'Classes'], ['students', 'Students'],
    ['payments', 'Payments'], ['approvals', 'Scores & Approvals'],
    ['teacherpass', 'Teacher Access'], ['entrance', 'Entrance Exam'], ['results', 'All Results'], ['settings', 'Settings']
  ];
  return `
  <div class="dash">
    <div class="tabbar">
      ${tabs.map(t => `<button class="tabbtn ${tab === t[0] ? 'active' : ''}" onclick="mgmtTab('${t[0]}')">${t[1]}</button>`).join('')}
    </div>
    <div class="tabpanel">${mgmtPanel(tab)}</div>
  </div>`;
}
function mgmtTab(t) { state.mgmtTab = t; render(); }

function mgmtPanel(tab) {
  if (tab === 'subjects') return mgmtSubjects();
  if (tab === 'classes') return mgmtClasses();
  if (tab === 'students') return mgmtStudents();
  if (tab === 'payments') return mgmtPayments();
  if (tab === 'approvals') return mgmtApprovals();
  if (tab === 'teacherpass') return mgmtTeacherPass();
  if (tab === 'entrance') return mgmtEntrance();
  if (tab === 'results') return mgmtResults();
  if (tab === 'settings') return mgmtSettings();
  return '';
}

function mgmtSubjects() {
  return `
  <h2>Subjects</h2>
  <div class="row">
    <input id="newSubjectName" placeholder="New subject name"/>
    <button class="btn primary" onclick="addSubject()">Add Subject</button>
  </div>
  ${DB.subjects.map(s => state.expandedSubjectId === s.id ? mgmtSubjectCard(s) : mgmtSubjectRow(s)).join('') || '<p class="hint">No subjects yet.</p>'}
  <p class="hint">Newest subjects appear at the top. Click "View" to edit a subject's password, 2nd Test mode, or which classes offer it.</p>`;
}
function mgmtSubjectRow(s) {
  const classCount = (s.classes || []).length;
  return `
  <div class="row spread" style="padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fff;">
    <div><b>${esc(s.name)}</b> <span class="hint">&middot; ${classCount} class${classCount === 1 ? '' : 'es'}</span></div>
    <button class="btn small" onclick="toggleSubjectExpand('${s.id}')">View</button>
  </div>`;
}
function toggleSubjectExpand(id) {
  state.expandedSubjectId = state.expandedSubjectId === id ? null : id;
  render();
}
function mgmtSubjectCard(s) {
  const bySec = classesBySection();
  const classCount = (s.classes || []).length;
  return `
  <div class="card" style="margin-top:14px;">
    <div class="row spread" style="margin-top:0;">
      <h3 style="margin:0;color:var(--navy);">${esc(s.name)}</h3>
      <button class="btn ghost small" onclick="toggleSubjectExpand('${s.id}')">Collapse</button>
    </div>
    <div class="grid2">
      <div><label>Name</label><input value="${esc(s.name)}" onchange="renameSubject('${s.id}', this.value)"/></div>
      <div><label>CBT Access Password</label><input value="${esc(s.password || '')}" placeholder="set access password" onchange="setSubjectPassword('${s.id}', this.value)"/></div>
      <div><label>2nd Test</label>
        <select onchange="setSecondTestMode('${s.id}', this.value)">
          <option value="cbt" ${(!s.secondTestMode || s.secondTestMode === 'cbt') ? 'selected' : ''}>CBT</option>
          <option value="manual" ${s.secondTestMode === 'manual' ? 'selected' : ''}>Manual entry</option>
        </select>
      </div>
      <div style="display:flex;align-items:flex-end;"><button class="btn danger small" onclick="deleteSubject('${s.id}')">Delete Subject</button></div>
    </div>
    <label style="margin-top:16px;">Classes offering this subject (${classCount} selected)</label>
    ${SECTIONS.map(sec => `
      <div class="hint" style="margin:8px 0 2px;font-weight:700;">${sec}</div>
      <div class="chiplist">
        ${(bySec[sec] || []).map(name => `
          <label class="opt ${(s.classes || []).includes(name) ? 'sel' : ''}" style="display:inline-flex;width:auto;">
            <input type="checkbox" ${(s.classes || []).includes(name) ? 'checked' : ''} onchange="toggleSubjectClass('${s.id}','${esc(name)}', this.checked)"/>
            <span>${esc(name)}</span>
          </label>`).join('') || '<span class="hint">No classes in this section yet — add some under the Classes tab.</span>'}
      </div>`).join('')}
  </div>`;
}
function toggleSubjectClass(subjectId, className, checked) {
  const s = DB.subjects.find(x => x.id === subjectId); if (!s) return;
  if (!s.classes) s.classes = [];
  if (checked) { if (!s.classes.includes(className)) s.classes.push(className); }
  else { s.classes = s.classes.filter(c => c !== className); }
  setData('subjects', DB.subjects).then(() => { flash('Classes updated.', 'success'); render(); });
}
function setSecondTestMode(id, val) {
  const s = DB.subjects.find(x => x.id === id); if (!s) return;
  s.secondTestMode = val;
  setData('subjects', DB.subjects).then(() => flash('2nd Test mode updated.', 'success'));
}
function addSubject() {
  const name = document.getElementById('newSubjectName').value.trim();
  if (!name) return;
  const newSubj = { id: uid('subj'), name, classes: [], schemes: {}, password: 'subj' + Math.floor(1000 + Math.random() * 9000) };
  DB.subjects.unshift(newSubj);
  state.expandedSubjectId = newSubj.id;
  setData('subjects', DB.subjects).then(() => flash('Subject added — now tick which classes offer it.', 'success'));
  render();
}
function renameSubject(id, val) {
  const s = DB.subjects.find(x => x.id === id); if (!s) return;
  s.name = val; setData('subjects', DB.subjects);
}
function setSubjectPassword(id, val) {
  const s = DB.subjects.find(x => x.id === id); if (!s) return;
  s.password = val; setData('subjects', DB.subjects).then(() => flash('Subject password updated.', 'success'));
}
function deleteSubject(id) {
  if (!confirm('Delete this subject? This does not delete existing scores.')) return;
  DB.subjects = DB.subjects.filter(x => x.id !== id);
  setData('subjects', DB.subjects).then(() => { flash('Subject deleted.', 'success'); render(); });
}

function mgmtClasses() {
  const bySec = classesBySection();
  return `
  <h2>Classes</h2>
  <div class="row wrap">
    <input id="newClassName" placeholder="New class name e.g. JSS1"/>
    <select id="newClassSection">${SECTIONS.map(s => `<option>${s}</option>`).join('')}</select>
    <button class="btn primary" onclick="addClass()">Add Class</button>
  </div>
  ${SECTIONS.map(sec => `
    <h3 style="margin-top:18px;">${sec}</h3>
    <div class="chiplist">
      ${(bySec[sec] || []).map(name => `<span class="chip">${esc(name)} <a href="#" onclick="deleteClass('${esc(name)}');return false;">&times;</a></span>`).join('') || '<p class="hint" style="margin:0">No classes yet.</p>'}
    </div>`).join('')}`;
}
function addClass() {
  const v = document.getElementById('newClassName').value.trim();
  const section = document.getElementById('newClassSection').value;
  if (!v || DB.classes.find(c => c.name === v)) return;
  DB.classes.push({ name: v, section }); setData('classes', DB.classes); render();
}
function deleteClass(name) {
  DB.classes = DB.classes.filter(x => x.name !== name);
  setData('classes', DB.classes); render();
}

function mgmtStudents() {
  return `
  <h2>Students</h2>
  <div class="row wrap">
    <input id="newStudReg" placeholder="Reg. Number"/>
    <input id="newStudName" placeholder="Full Name"/>
    <select id="newStudClass">${DB.classes.map(c => `<option>${esc(c.name)}</option>`).join('')}</select>
    <button class="btn primary" onclick="addStudent()">Add Student</button>
  </div>
  <table class="tbl">
    <tr><th>Reg. No.</th><th>Name</th><th>Class</th><th></th></tr>
    ${DB.students.map(s => `
      <tr>
        <td>${esc(s.reg)}</td>
        <td><input value="${esc(s.name)}" onchange="editStudentName('${esc(s.reg)}', this.value)"/></td>
        <td>
          <select onchange="editStudentClass('${esc(s.reg)}', this.value)">
            ${DB.classes.map(c => `<option ${c.name === s.class ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
          </select>
        </td>
        <td><button class="btn danger small" onclick="deleteStudent('${esc(s.reg)}')">Delete</button></td>
      </tr>`).join('')}
  </table>`;
}
function addStudent() {
  const reg = document.getElementById('newStudReg').value.trim();
  const name = document.getElementById('newStudName').value.trim();
  const cls = document.getElementById('newStudClass').value;
  if (!reg || !name) { flash('Reg. number and name are required.', 'error'); return; }
  if (DB.students.find(s => s.reg === reg)) { flash('A student with that reg. number already exists.', 'error'); return; }
  DB.students.push({ reg, name, class: cls });
  setData('students', DB.students).then(() => flash('Student added.', 'success'));
  render();
}
function editStudentName(reg, val) {
  const s = DB.students.find(x => x.reg === reg); if (!s) return;
  s.name = val; setData('students', DB.students);
}
function editStudentClass(reg, val) {
  const s = DB.students.find(x => x.reg === reg); if (!s) return;
  s.class = val; setData('students', DB.students);
}
function deleteStudent(reg) {
  if (!confirm('Delete this student record?')) return;
  DB.students = DB.students.filter(x => x.reg !== reg);
  setData('students', DB.students).then(() => render());
}

function mgmtPayments() {
  const bySec = classesBySection();
  const sel = state.payClass;
  if (!sel) {
    return `
    <h2>Examination Payment Approval</h2>
    <p class="hint">Pick a class, then paste the reg. numbers of students who have paid. This unlocks the CBT Examination for every subject in that class. Does not restrict the Test.</p>
    ${SECTIONS.map(sec => (bySec[sec] || []).length ? `
      <div class="hint" style="margin:10px 0 4px;font-weight:700;">${sec}</div>
      <div class="pickgrid">
        ${(bySec[sec] || []).map(cn => `<div class="pickcard" onclick="setPayClass('${esc(cn)}')"><div class="pickcard-title">${esc(cn)}</div></div>`).join('')}
      </div>` : '').join('') || '<p class="hint">No classes set up yet.</p>'}`;
  }
  const paidList = (DB.paid[sel] || []);
  return `
  <div class="row spread">
    <h2>${esc(sel)} &mdash; Payment Approval</h2>
    <button class="btn ghost small" onclick="state.payClass=null;render()">Change Class</button>
  </div>
  <div class="row">
    <textarea id="paidRegs" placeholder="Paste reg. numbers, one per line or comma-separated" rows="3"></textarea>
  </div>
  <button class="btn primary" onclick="addPaid('${esc(sel)}')">Mark as Paid</button>
  <table class="tbl">
    <tr><th>Reg. No.</th><th>Name</th><th></th></tr>
    ${paidList.map(r => {
      const stu = DB.students.find(s => s.reg === r);
      return `<tr><td>${esc(r)}</td><td>${esc(stu ? stu.name : '(unknown)')}</td><td><button class="btn danger small" onclick="removePaid('${esc(sel)}', '${esc(r)}')">Remove</button></td></tr>`;
    }).join('') || `<tr><td colspan="3">No one marked paid yet for ${esc(sel)}.</td></tr>`}
  </table>`;
}
function setPayClass(v) { state.payClass = v; render(); }
function addPaid(className) {
  if (!className) { flash('Select a class first.', 'error'); return; }
  const raw = document.getElementById('paidRegs').value;
  const regs = raw.split(/[\n,]/).map(x => x.trim()).filter(Boolean);
  if (!DB.paid[className]) DB.paid[className] = [];
  regs.forEach(r => { if (!DB.paid[className].includes(r)) DB.paid[className].push(r); });
  setData('paid', DB.paid).then(() => flash('Payment list updated.', 'success'));
  render();
}
function removePaid(className, reg) {
  DB.paid[className] = (DB.paid[className] || []).filter(r => r !== reg);
  setData('paid', DB.paid); render();
}

function mgmtApprovals() {
  const subjOpts = DB.subjects.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  const sel = state.apprSubject || (DB.subjects[0] && DB.subjects[0].id);
  const rows = DB.students.map(s => {
    const a = getAttempt(s.reg, sel);
    const m = getManual(s.reg, sel);
    return { s, a, m };
  });
  return `
  <h2>Scores &amp; Approvals</h2>
  <label>Subject</label>
  <select onchange="setApprSubject(this.value)">${subjOpts}</select>
  <table class="tbl small">
    <tr><th>Reg</th><th>Name</th><th>1st Test</th><th>CBT Test</th><th>CBT Exam</th><th>Theory</th><th>Actions</th></tr>
    ${rows.map(r => `
      <tr>
        <td>${esc(r.s.reg)}</td><td>${esc(r.s.name)}</td>
        <td>${r.m.test1 != null ? r.m.test1 : '-'}</td>
        <td>${r.a.testScore != null ? r.a.testScore + (r.a.testDone ? '' : '') : '-'}</td>
        <td>${r.a.examScore != null ? r.a.examScore : '-'}</td>
        <td>${r.m.theory != null ? r.m.theory : '-'}</td>
        <td>
          ${r.a.testDone ? `<button class="btn ghost small" onclick="cancelAttempt('${sel}','${esc(r.s.reg)}','test')">Cancel Test</button>` : ''}
          ${r.a.examDone ? `<button class="btn ghost small" onclick="cancelAttempt('${sel}','${esc(r.s.reg)}','exam')">Cancel Exam</button>` : ''}
          <button class="btn small" onclick="approveRetake('${sel}','${esc(r.s.reg)}')">Approve Retake</button>
        </td>
      </tr>`).join('')}
  </table>
  <p class="hint">Cancelling a component clears that score so the student may attempt it again. "Approve Retake" grants one extra attempt for both test and exam on this subject.</p>`;
}
function setApprSubject(v) { state.apprSubject = v; render(); }
function cancelAttempt(subjectId, reg, which) {
  if (!confirm('Cancel this recorded score?')) return;
  if (!DB.attempts[reg] || !DB.attempts[reg][subjectId]) return;
  const a = DB.attempts[reg][subjectId];
  if (which === 'test') { a.testDone = false; a.testScore = null; }
  if (which === 'exam') { a.examDone = false; a.examScore = null; }
  setData('attempts', DB.attempts).then(() => { flash('Score cancelled.', 'success'); render(); });
}
function approveRetake(subjectId, reg) {
  if (!DB.attempts[reg]) DB.attempts[reg] = {};
  if (!DB.attempts[reg][subjectId]) DB.attempts[reg][subjectId] = {};
  DB.attempts[reg][subjectId].approvedRetake = true;
  setData('attempts', DB.attempts).then(() => flash('Retake approved for ' + reg + '.', 'success'));
}

function mgmtTeacherPass() {
  return `
  <h2>Teacher Portal Access</h2>
  <p class="hint">This single password is shared with all teachers to access the Teacher Portal.</p>
  <div class="row">
    <input id="teacherPassInput" value="${esc(DB.teacherPassword)}"/>
    <button class="btn primary" onclick="saveTeacherPass()">Save</button>
    <button class="btn ghost" onclick="regenTeacherPass()">Generate New</button>
  </div>`;
}
function saveTeacherPass() {
  const v = document.getElementById('teacherPassInput').value.trim();
  if (!v) return;
  DB.teacherPassword = v;
  setData('teacherPassword', v).then(() => flash('Teacher password updated.', 'success'));
}
function regenTeacherPass() {
  DB.teacherPassword = 'oecms-teacher-' + Math.floor(1000 + Math.random() * 9000);
  setData('teacherPassword', DB.teacherPassword).then(() => { flash('New teacher password generated.', 'success'); render(); });
}

/* ===================== ENTRANCE EXAMINATION (Management side) ===================== */
function mgmtEntrance() {
  const ec = DB.entranceConfig;
  const candidates = DB.entranceCandidates;
  return `
  <h2>Entrance Examination Setup</h2>

  <h3>1. Subjects covered</h3>
  <p class="hint">Pick which subjects new intake candidates will be examined on. Teachers set that subject's entrance questions from the Teacher Portal once it's selected here.</p>
  <div class="chiplist">
    ${DB.subjects.map(s => `
      <label class="opt ${ec.subjects.includes(s.id) ? 'sel' : ''}" style="display:inline-flex;width:auto;">
        <input type="checkbox" ${ec.subjects.includes(s.id) ? 'checked' : ''} onchange="toggleEntranceSubject('${s.id}', this.checked)"/>
        <span>${esc(s.name)}</span>
      </label>`).join('') || '<p class="hint">No subjects yet — add some under the Subjects tab first.</p>'}
  </div>

  <h3 style="margin-top:22px;">2. Settings</h3>
  <div class="grid2">
    <div><label>Questions per subject</label><input id="ec_qcount" type="number" value="${ec.qCountPerSubject}"/></div>
    <div><label>Duration per subject (minutes)</label><input id="ec_dur" type="number" value="${ec.durationMin}"/></div>
    <div><label>Candidate Access Password</label><input id="ec_pass" value="${esc(ec.password)}"/></div>
  </div>
  <button class="btn primary" onclick="saveEntranceConfig()">Save Settings</button>

  <h3 style="margin-top:22px;">3. Register a candidate</h3>
  <div class="row wrap">
    <input id="newCandName" placeholder="Candidate full name"/>
    <select id="newCandClass">${DB.classes.map(c => `<option>${esc(c.name)}</option>`).join('')}</select>
    <button class="btn primary" onclick="registerCandidate()">Register &amp; Generate Candidate No.</button>
  </div>

  <h3 style="margin-top:22px;">4. Candidates &amp; Results</h3>
  <table class="tbl small">
    <tr><th>Candidate No.</th><th>Name</th><th>Applying For</th>${ec.subjects.map(id => { const s = DB.subjects.find(x => x.id === id); return s ? `<th>${esc(s.name)}</th>` : ''; }).join('')}<th>Total</th><th></th></tr>
    ${candidates.map(cand => {
      const att = DB.entranceAttempts[cand.id] || {};
      let total = 0, max = 0;
      const cells = ec.subjects.map(id => {
        const a = att[id];
        if (a) { total += a.score; max += a.max; return `<td>${a.score}/${a.max}</td>`; }
        return `<td>-</td>`;
      }).join('');
      return `<tr>
        <td>${esc(cand.id)}</td><td>${esc(cand.name)}</td><td>${esc(cand.appliedClass)}</td>
        ${cells}

function parseQuestionBank(text) {
  const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const out = [];
  blocks.forEach(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    let topic = '', qText = '', correct = 'A';
    const opts = { A: '', B: '', C: '', D: '' };
    lines.forEach(line => {
      let m;
      if ((m = line.match(/^Topic:\s*(.+)$/i))) { topic = m[1]; return; }
      if ((m = line.match(/^Answer:\s*([A-D])/i))) { correct = m[1].toUpperCase(); return; }
      if ((m = line.match(/^([A-D])[\)\.]\s*(.+)$/i))) { opts[m[1].toUpperCase()] = m[2]; return; }
      const qm = line.match(/^(?:Q\d*[:.]|\d+[.)])\s*(.+)$/i);
      if (qm) { qText = qText ? qText + ' ' + qm[1] : qm[1]; return; }
      qText = qText ? qText + ' ' + line : line;
    });
    if (qText && opts.A && opts.B && opts.C && opts.D) {
      out.push({ q: qText, A: opts.A, B: opts.B, C: opts.C, D: opts.D, correct, topic });
    }
  });
  return out;
}
function saveBankAppend(subjectId) {
  const text = document.getElementById('bankPaste').value;

  if (!parsed.length) { flash('Could not find any properly formatted questions in that text. Check the format example above.', 'error'); return; }
  if (!DB.questionBank[subjectId]) DB.questionBank[subjectId] = [];
  DB.questionBank[subjectId] = DB.questionBank[subjectId].concat(parsed);
  setData('questionBank', DB.questionBank).then(() => {

    render();

function saveQuestions(subjectId, kind, count, className) {

function generateFromBank(subjectId, kind, count, className) {
  const bank = DB.questionBank[subjectId] || [];
  const topicsEl = document.getElementById(`topicFocus_${kind}`);
  const topicsRaw = topicsEl ? topicsEl.value.trim() : '';
  let pool = bank;
  if (topicsRaw) {
    const wanted = topicsRaw.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
    pool = bank.filter(q => q.topic && wanted.some(t => q.topic.toLowerCase().includes(t)));
    if (pool.length < count) {
      flash(`Only ${pool.length} bank question(s) match those topics -- need ${count}. Add more to the bank, tag more questions with those topics, or broaden your topic list.`, 'error');
      return;
    }
  } else if (pool.length < count) {
    flash(`The question bank only has ${pool.length} question(s) -- need at least ${count}. Add more on the Question Bank tab first.`, 'error');
    return;
  }
  const picked = shuffle(pool).slice(0, count).map(q => ({ q: q.q || '', A: q.A || '', B: q.B || '', C: q.C || '', D: q.D || '', correct: (q.correct || 'A').toUpperCase() }));
  state.questionDraft = { subjectId, kind, className: className || null, items: picked };
  flash(`Picked ${count} question(s) from the bank -- review below, then Save.`, 'success');
}

async function aiGenerate(subjectId, kind, count, className) {
  const subj = DB.subjects.find(s => s.id === subjectId);
  const schemeText = kind === 'entrance' ? (subj.entranceScheme || '') : ((subj.schemes || {})[className] || '');
  if (!subj || !schemeText.trim()) {
    flash(kind === 'entrance' ? 'Please save an entrance scheme of work first.' : 'Please save a scheme of work for this class first.', 'error');
    return;
  }
  const topicsEl = document.getElementById(`topicFocus_${kind}`);
  const topics = topicsEl ? topicsEl.value.trim() : '';
  state.aiBusy = true; render();
  try {
    const response = await fetch("/api/generate-questions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ subjectName: subj.name, scheme: schemeText, kind, count, topics, className })
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    const arr = data.questions;
    if (!Array.isArray(arr) || !arr.length) throw new Error('Bad AI response');
    const items = [];
    for (let i = 0; i < count; i++) {
      const q = arr[i] || { q: '', A: '', B: '', C: '', D: '', correct: 'A' };
      items.push({ q: q.q || '', A: q.A || '', B: q.B || '', C: q.C || '', D: q.D || '', correct: (q.correct || 'A').toUpperCase() });
    }
    state.questionDraft = { subjectId, kind, className: className || null, items };
    flash('Draft questions generated — review and edit, then Save.', 'success');
  } catch (e) {
    console.error(e);
    flash('AI generation failed. You can still enter questions manually.', 'error');
  }
  state.aiBusy = false; render();
}

function startRun(mode) {
  const subj = DB.subjects.find(s => s.id === state.studentSubjectId);
  const bank = ((DB.questions[subj.id] || {})[state.studentClass] || {})[mode] || [];
  const count = mode === 'test' ? DB.config.testQCount : DB.config.examQCount;
  const durMin = mode === 'test' ? DB.config.testDurationMin : DB.config.examDurationMin;
  if (bank.length < count) { flash('Questions are not fully set up yet.', 'error'); return; }
  state.runContext = 'student';
  state.runMode = mode;
  // Each student session gets its own randomised question order AND its own
  // randomised A/B/C/D option order, so no two students see the same
  // question-number-to-option-letter layout on screen at the same time.
  state.runQuestions = shuffle(bank.slice(0, count).map((q, i) => Object.assign({ idx: i }, q))).map(shuffleOptions);
  state.runAnswers = {};
  state.runSecondsLeft = durMin * 60;
  state.warnCount = 0;
  go('student-run');
  state.runTimer = setInterval(tickTimer, 1000);
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffleOptions(q) {
  const letters = ['A', 'B', 'C', 'D'];
  const pairs = shuffle(letters.map(l => ({ text: q[l], isCorrect: l === q.correct })));
  const out = Object.assign({}, q);
  pairs.forEach((p, i) => {
    out[letters[i]] = p.text;
    if (p.isCorrect) out.correct = letters[i];
  });
  return out;
}
function tickTimer() {
  state.runSecondsLeft--;
  if (state.runSecondsLeft <= 0) {
    clearInterval(state.runTimer);
    submitRun(true);
    return;
  }
  const el = document.getElementById('runTimerDisplay');
  if (el) el.textContent = fmtTime(state.runSecondsLeft);
}
function fmtTime(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

function viewStudentRun() {

  return `

    ${state.runQuestions.map((q, i) => `
      <div class="qview">
        <div class="qview-text"><b>${i + 1}.</b> ${esc(q.q)}</div>

}
function setAnswer(i, o) { state.runAnswers[i] = o; render(); }
function confirmSubmit() {
  const answered = Object.keys(state.runAnswers).length;
  if (answered < state.runQuestions.length) {
    if (!confirm(`You have answered ${answered}/${state.runQuestions.length} questions. Submit anyway?`)) return;
  } else if (!confirm('Submit now? You cannot change your answers afterwards.')) return;
  clearInterval(state.runTimer);
  submitRun(false);
}
function submitRun(auto) {
  let score = 0;
  state.runQuestions.forEach((q, i) => { if (state.runAnswers[i] === q.correct) score++; });
  const qCount = state.runQuestions.length;

  if (state.runContext === 'entrance') {
    const candidateId = state.entranceCandidateId;
    const subjectId = state.studentSubjectId;
    if (!DB.entranceAttempts[candidateId]) DB.entranceAttempts[candidateId] = {};
    DB.entranceAttempts[candidateId][subjectId] = { score, max: qCount, done: true, at: new Date().toISOString() };
    setData('entranceAttempts', DB.entranceAttempts).then(() => {
      flash((auto ? 'Time up — ' : '') + 'Submitted. Score recorded.', 'success');
      state.runContext = 'student';
      go('entrance-dash');
    });
    return;
  }

  const maxMarks = state.runMode === 'test' ? DB.config.cbtTestMax : DB.config.cbtExamMax;
  const scaled = Math.round((score / qCount) * maxMarks * 10) / 10;

  const reg = state.studentReg, subjectId = state.studentSubjectId;
  if (!DB.attempts[reg]) DB.attempts[reg] = {};
  if (!DB.attempts[reg][subjectId]) DB.attempts[reg][subjectId] = {};
  const a = DB.attempts[reg][subjectId];
  if (state.runMode === 'test') { a.testDone = true; a.testScore = scaled; a.testAt = new Date().toISOString(); }
  else { a.examDone = true; a.examScore = scaled; a.examAt = new Date().toISOString(); }
  a.approvedRetake = false;
  setData('attempts', DB.attempts).then(() => {
    flash((auto ? 'Time up — ' : '') + 'Submitted. Score recorded.', 'success');
    go('student-dash');
  });
}

      </div>
    </div>
    <h3 class="result-title">Continuous Assessment &amp; Examination Result &mdash; ${esc(DB.config.session)}, ${esc(DB.config.term)}</h3>
    <div class="grid2 result-meta">
      <div><b>Name:</b> ${esc(stu.name)}</div>
      <div><b>Reg. No.:</b> ${esc(stu.reg)}</div>
      <div><b>Class:</b> ${esc(stu.class)}</div>
      <div><b>Class Position (Overall):</b> ${overall.position ? overall.position + ' of ' + overall.outOf : 'Pending'}</div>
    </div>
    <table class="tbl result-tbl">
      <tr>
        <th>Subject</th><th>1st Test (${DB.config.firstTestMax})</th><th>CBT Test (${DB.config.cbtTestMax})</th>
        <th>CBT Exam (${DB.config.cbtExamMax})</th><th>Theory (${DB.config.theoryMax})</th>
        <th>Total (${subjectMaxTotal()})</th><th>Grade</th><th>Position</th>
      </tr>
      ${rows.map(r => `
        <tr>
          <td>${esc(r.subj.name)}</td>
          <td>${r.b.test1 != null ? r.b.test1 : '-'}</td>
          <td>${r.b.cbtTest != null ? r.b.cbtTest : '-'}</td>
          <td>${r.b.cbtExam != null ? r.b.cbtExam : '-'}</td>
          <td>${r.b.theory != null ? r.b.theory : '-'}</td>
          <td><b>${r.b.complete ? r.b.total : '-'}</b></td>
          <td>${r.b.grade}</td>
          <td>${r.rank.position ? r.rank.position + '/' + r.rank.outOf : 'Pending'}</td>
        </tr>`).join('')}
    </table>
    <div class="grid2 result-summary">
      <div><b>Grand Total:</b> ${grandTotal} / ${grandMax}</div>
      <div><b>Average:</b> ${avg}%</div>
    </div>
    <p class="hint">Grading: A=70-100, B=60-69, C=50-59, D=45-49, E=40-44, F=0-39.</p>
    <div class="result-footer">Generated via the ${esc(DB.config.shortName)} CBT Portal.</div>
  </div>
  <div class="noprint">
    <button class="btn primary" onclick="window.print()">Print / Save as PDF</button>
  </div>`;
}

/* ===================== ENTRANCE EXAMINATION (Candidate side) ===================== */
function viewEntrancePortal() {
  return `
  <div class="hero">
    <h1>Entrance Examination</h1>
    <p class="hero-sub">For new intake students / pupils</p>
  </div>
  <div class="portal-grid">
    <div class="portal-card" onclick="go('entrance-login')">
      <div class="portal-icon">E</div>
      <h3>Sit the Entrance Exam</h3>
      <p>Candidates with a Candidate No. can log in here.</p>
    </div>
    <div class="portal-card" onclick="go('entrance-result-login')">
      <div class="portal-icon">R</div>
      <h3>Check Entrance Result</h3>
      <p>See your score using your Candidate No.</p>
    </div>
  </div>`;
}
function viewEntranceLogin() {
  return `
  <div class="card narrow">
    <h2>Candidate Login</h2>
    <label>Candidate Number</label>
    <input id="entCandId" placeholder="e.g. ENT-4821"/>
    <label>Candidate Access Password</label>
    <input id="entCandPass" type="password"/>
    <button class="btn primary" onclick="doEntranceLogin()">Continue</button>
  </div>`;
}
function doEntranceLogin() {
  const id = document.getElementById('entCandId').value.trim().toUpperCase();
  const pass = document.getElementById('entCandPass').value;
  const cand = DB.entranceCandidates.find(c => c.id === id);
  if (!cand) { flash('Candidate number not found. Contact management.', 'error'); return; }
  if (pass !== DB.entranceConfig.password) { flash('Incorrect access password.', 'error'); return; }
  state.entranceCandidateId = id;
  go('entrance-dash');
}
function viewEntranceDash() {
  const cand = DB.entranceCandidates.find(c => c.id === state.entranceCandidateId);
  if (!cand) return viewEntranceLogin();
  const ec = DB.entranceConfig;
  const att = DB.entranceAttempts[cand.id] || {};
  return `
  <div class="card">
    <h2>Welcome, ${esc(cand.name)}</h2>
    <p>Candidate No.: <b>${esc(cand.id)}</b> &middot; Applying for: ${esc(cand.appliedClass)}</p>
    <div class="noticebox">
      <b>Examination Malpractice Notice:</b> Any form of malpractice is strictly prohibited. Use your time wisely — each subject submits automatically when its timer reaches zero.
    </div>
    <div class="grid2">
      ${ec.subjects.map(id => {
        const s = DB.subjects.find(x => x.id === id);
        if (!s) return '';
        const bank = (DB.questions[id] && DB.questions[id].entrance) || [];
        const ready = bank.length >= ec.qCountPerSubject;
        const done = att[id] && att[id].done;
        return `
        <div class="taskcard">
          <h3>${esc(s.name)}</h3>
          <p>${ec.qCountPerSubject} questions &middot; ${ec.durationMin} minutes</p>
          ${done ? `<p class="ok">Completed. Score: ${att[id].score}/${att[id].max}</p>` : ''}
          <button class="btn primary" ${(!ready || done) ? 'disabled' : ''} onclick="startEntranceRun('${id}')">
            ${!ready ? 'Not yet available' : (done ? 'Already Completed' : 'Start')}
          </button>
        </div>`;
      }).join('') || '<p class="hint">No subjects configured yet.</p>'}
    </div>
    <button class="btn ghost" onclick="state.entranceCandidateId=null; go('entrance-portal')">Log Out</button>
  </div>`;
}
function startEntranceRun(subjectId) {
  const bank = (DB.questions[subjectId] && DB.questions[subjectId].entrance) || [];
  const count = DB.entranceConfig.qCountPerSubject;
  const durMin = DB.entranceConfig.durationMin;
  if (bank.length < count) { flash('Questions are not fully set up yet.', 'error'); return; }
  state.runContext = 'entrance';
  state.studentSubjectId = subjectId;
  state.runMode = 'exam';
  state.runQuestions = shuffle(bank.slice(0, count).map((q, i) => Object.assign({ idx: i }, q))).map(shuffleOptions);
  state.runAnswers = {};
  state.runSecondsLeft = durMin * 60;
  state.warnCount = 0;
  go('student-run');
  state.runTimer = setInterval(tickTimer, 1000);
}
function viewEntranceResultLogin() {
  return `
  <div class="card narrow">
    <h2>Check Entrance Result</h2>
    <label>Candidate Number</label>
    <input id="entResultId" placeholder="e.g. ENT-4821"/>
    <button class="btn primary" onclick="doEntranceResultLogin()">View Result</button>
  </div>`;
}
function doEntranceResultLogin() {
  const id = document.getElementById('entResultId').value.trim().toUpperCase();
  const cand = DB.entranceCandidates.find(c => c.id === id);
  if (!cand) { flash('Candidate number not found.', 'error'); return; }
  state.entranceCandidateId = id;
  state.fromAdmin = false;
  go('entrance-result-view');
}
function viewEntranceResultView() {
  const cand = DB.entranceCandidates.find(c => c.id === state.entranceCandidateId);
  if (!cand) return `<p>Candidate not found.</p>`;
  const ec = DB.entranceConfig;
  const att = DB.entranceAttempts[cand.id] || {};
  let total = 0, max = 0;
  const rows = ec.subjects.map(id => {
    const s = DB.subjects.find(x => x.id === id);
    if (!s) return null;
    const a = att[id];
    if (a) { total += a.score; max += a.max; }
    return { name: s.name, a };
  }).filter(Boolean);
  return `
  <div class="result-sheet">
    <img src="${LOGO}" class="watermark" alt=""/>
    <div class="result-header">
      <img src="${LOGO}" class="result-logo" alt="logo"/>
      <div>
        <div class="result-school">${esc(DB.config.schoolName)}</div>
        <div class="result-addr">${esc(DB.config.address)}</div>
        <div class="result-addr">${esc(DB.config.email)}${DB.config.phone ? ' | ' + esc(DB.config.phone) : ''}</div>
      </div>
    </div>
    <h3 class="result-title">Entrance Examination Result &mdash; ${esc(DB.config.session)}</h3>
    <div class="grid2 result-meta">
      <div><b>Name:</b> ${esc(cand.name)}</div>
      <div><b>Candidate No.:</b> ${esc(cand.id)}</div>
      <div><b>Applying For:</b> ${esc(cand.appliedClass)}</div>
    </div>
    <table class="tbl result-tbl">
      <tr><th>Subject</th><th>Score</th></tr>
      ${rows.map(r => `<tr><td>${esc(r.name)}</td><td>${r.a ? r.a.score + ' / ' + r.a.max : 'Pending'}</td></tr>`).join('')}
    </table>
    <div class="grid2 result-summary">
      <div><b>Total:</b> ${max ? total + ' / ' + max : 'Pending'}</div>
    </div>
    <div class="result-footer">Generated via the ${esc(DB.config.shortName)} CBT Portal.</div>
  </div>
  <div class="noprint">
    <button class="btn primary" onclick="window.print()">Print / Save as PDF</button>
  </div>`;
}

/* ---------- boot ---------- */
window.__afterRender = null;
boot().catch(err => {
  console.error('Boot failed:', err);
  const appEl = document.getElementById('app');
  if (appEl) appEl.innerHTML = `<div style="padding:60px 20px;text-align:center;color:#fff;">
    <p>Something went wrong loading the portal.</p>
    <p style="color:#b9c2d6;font-size:.85rem;">Please refresh the page. If this keeps happening, contact the school with a screenshot of this message.</p>
  </div>`;
});

</script>
</body>
</html>
